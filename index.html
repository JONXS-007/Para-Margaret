<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Margaret</title>
  <style>
    :root {
      --primary-pink: #ff9ebb;
      --soft-pink: #ffe3ec;
      --accent-yellow: #ffd000;
      --dark-bg: #0d0614;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #26102a 0%, var(--dark-bg) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Título animado en rosa pastel con resplandor */
    #title {
      position: absolute;
      top: 6%;
      text-align: center;
      color: var(--primary-pink);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 8px;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px rgba(255, 158, 187, 0.8),
        0 0 25px rgba(255, 105, 180, 0.6),
        0 0 45px rgba(219, 112, 147, 0.4);
      animation: pulseTitle 3s ease-in-out infinite alternate;
      z-index: 10;
      width: 100%;
    }

    @keyframes pulseTitle {
      0% { transform: scale(0.98); opacity: 0.9; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    /* Escenario principal con flotación 3D */
    .bouquet-container {
      position: relative;
      width: 480px;
      height: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: floatBouquet 6s ease-in-out infinite alternate;
    }

    @keyframes floatBouquet {
      0% { transform: translateY(10px) rotate(-1deg); }
      100% { transform: translateY(-15px) rotate(1deg); }
    }

    /* Fondo de destellos / luces mágicas */
    .sparkle {
      position: absolute;
      background: radial-gradient(circle, #ffe680 0%, rgba(255, 230, 128, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Animación de la Abeja Volando */
    .bee-animated {
      animation: beeFly 4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes beeFly {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(12px, -18px) rotate(8deg); }
      66% { transform: translate(-8px, -25px) rotate(-5deg); }
      100% { transform: translate(15px, -10px) rotate(6deg); }
    }

    .wing-left {
      animation: flapLeft 0.15s ease-in-out infinite alternate;
      transform-origin: 220px 115px;
    }
    .wing-right {
      animation: flapRight 0.15s ease-in-out infinite alternate;
      transform-origin: 235px 115px;
    }

    @keyframes flapLeft {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-25deg) scaleY(0.8); }
    }
    @keyframes flapRight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(25deg) scaleY(0.8); }
    }

    /* Brillo continuo en las luces LED */
    .led-glow {
      animation: ledPulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes ledPulse {
      0% { opacity: 0.4; filter: drop-shadow(0 0 2px #ffe066); }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #ffe066); }
    }
  </style>
</head>
<body>

  <div id="title">PARA MI MARGARET</div>

  <!-- Contenedor del Ramo Ilustrado y Animado -->
  <div class="bouquet-container" id="bouquetContainer">
    
    <!-- SVG Vectorial con sombras, texturas e iluminación -->
    <svg width="460" height="560" viewBox="0 0 460 560" fill="none" xmlns="http://www.w3.org/2000/svg">
      
      <defs>
        <!-- Gradientes para Pétalos y Envoltorio -->
        <radialGradient id="sunflowerCenter" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(40)">
          <stop offset="0%" stop-color="#4a2306"/>
          <stop offset="70%" stop-color="#261002"/>
          <stop offset="100%" stop-color="#120600"/>
        </radialGradient>

        <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe033"/>
          <stop offset="70%" stop-color="#ffb300"/>
          <stop offset="100%" stop-color="#e68a00"/>
        </linearGradient>

        <linearGradient id="paperWrap" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffccd8" stop-opacity="0.85"/>
          <stop offset="50%" stop-color="#f7a8be" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#e8829d" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="paperBack" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fce4ec" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#f48fb1" stop-opacity="0.8"/>
        </linearGradient>

        <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffe066"/>
          <stop offset="100%" stop-color="#ffa700"/>
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- CAPA 1: Papel Envoltorio Trasero en Puntas (Estilo Coreano) -->
      <g filter="url(#shadow)">
        <polygon points="230,120 120,40 100,180" fill="url(#paperBack)" />
        <polygon points="230,120 340,40 360,180" fill="url(#paperBack)" />
        <polygon points="230,120 60,100 70,260" fill="url(#paperBack)" />
        <polygon points="230,120 400,100 390,260" fill="url(#paperBack)" />
      </g>

      <!-- CAPA 2: Luces LED Traseras -->
      <g class="led-glow">
        <circle cx="110" cy="120" r="4" fill="#fff5b8" />
        <circle cx="350" cy="120" r="4" fill="#fff5b8" />
        <circle cx="80" cy="200" r="4" fill="#fff5b8" />
        <circle cx="380" cy="200" r="4" fill="#fff5b8" />
        <circle cx="140" cy="70" r="4" fill="#fff5b8" />
        <circle cx="320" cy="70" r="4" fill="#fff5b8" />
      </g>

      <!-- CAPA 3: Hojas Verdes de Fondo -->
      <g>
        <path d="M120 220 Q 80 180 90 140 Q 140 180 120 220 Z" fill="#388e3c" />
        <path d="M340 220 Q 380 180 370 140 Q 320 180 340 220 Z" fill="#388e3c" />
        <path d="M230 160 Q 210 90 230 70 Q 250 90 230 160 Z" fill="#2e7d32" />
      </g>

      <!-- CAPA 4: MARGARITAS BLANCAS PEQUEÑAS -->
      <!-- Función de utilidad representada directamente en SVG -->
      <g filter="url(#shadow)">
        <!-- Margarita 1 -->
        <g transform="translate(140, 160) scale(0.65)">
          <circle cx="0" cy="0" r="10" fill="#ffd54f"/>
          <path d="M0 -10 C -5 -22 5 -22 0 -10 M 10 0 C 22 -5 22 5 10 0 M 0 10 C 5 22 -5 22 0 10 M -10 0 C -22 5 -22 -5 -10 0 M 7 -7 C 18 -18 11 -22 7 -7 M 7 7 C 18 18 22 11 7 7 M -7 7 C -18 18 -22 11 -7 7 M -7 -7 C -18 -18 -11 -22 -7 -7" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
        <!-- Margarita 2 -->
        <g transform="translate(320, 160) scale(0.65)">
          <circle cx="0" cy="0" r="10" fill="#ffd54f"/>
          <path d="M0 -10 C -5 -22 5 -22 0 -10 M 10 0 C 22 -5 22 5 10 0 M 0 10 C 5 22 -5 22 0 10 M -10 0 C -22 5 -22 -5 -10 0 M 7 -7 C 18 -18 11 -22 7 -7 M 7 7 C 18 18 22 11 7 7 M -7 7 C -18 18 -22 11 -7 7 M -7 -7 C -18 -18 -11 -22 -7 -7" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
        <!-- Margarita 3 -->
        <g transform="translate(230, 130) scale(0.7)">
          <circle cx="0" cy="0" r="10" fill="#ffd54f"/>
          <path d="M0 -10 C -5 -22 5 -22 0 -10 M 10 0 C 22 -5 22 5 10 0 M 0 10 C 5 22 -5 22 0 10 M -10 0 C -22 5 -22 -5 -10 0 M 7 -7 C 18 -18 11 -22 7 -7 M 7 7 C 18 18 22 11 7 7 M -7 7 C -18 18 -22 11 -7 7 M -7 -7 C -18 -18 -11 -22 -7 -7" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
        <!-- Margarita 4 -->
        <g transform="translate(120, 270) scale(0.6)">
          <circle cx="0" cy="0" r="10" fill="#ffd54f"/>
          <path d="M0 -10 C -5 -22 5 -22 0 -10 M 10 0 C 22 -5 22 5 10 0 M 0 10 C 5 22 -5 22 0 10 M -10 0 C -22 5 -22 -5 -10 0 M 7 -7 C 18 -18 11 -22 7 -7 M 7 7 C 18 18 22 11 7 7 M -7 7 C -18 18 -22 11 -7 7 M -7 -7 C -18 -18 -11 -22 -7 -7" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
        <!-- Margarita 5 -->
        <g transform="translate(340, 270) scale(0.6)">
          <circle cx="0" cy="0" r="10" fill="#ffd54f"/>
          <path d="M0 -10 C -5 -22 5 -22 0 -10 M 10 0 C 22 -5 22 5 10 0 M 0 10 C 5 22 -5 22 0 10 M -10 0 C -22 5 -22 -5 -10 0 M 7 -7 C 18 -18 11 -22 7 -7 M 7 7 C 18 18 22 11 7 7 M -7 7 C -18 18 -22 11 -7 7 M -7 -7 C -18 -18 -11 -22 -7 -7" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- CAPA 5: GIRASOLES ARTESANALES ANIMADOS -->
      
      <!-- Girasol Superior Centro -->
      <g transform="translate(230, 200)" filter="url(#shadow)">
        <!-- Pétalos -->
        <g>
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(0)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(30)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(60)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(90)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(120)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(150)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(180)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(210)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(240)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(270)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(300)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(330)" />
        </g>
        <!-- Centro -->
        <circle cx="0" cy="0" r="28" fill="url(#sunflowerCenter)" stroke="#6d3811" stroke-width="3"/>
      </g>

      <!-- Girasol Izquierda -->
      <g transform="translate(160, 260) scale(0.9)" filter="url(#shadow)">
        <g>
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(0)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(30)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(60)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(90)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(120)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(150)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(180)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(210)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(240)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(270)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(300)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(330)" />
        </g>
        <circle cx="0" cy="0" r="28" fill="url(#sunflowerCenter)" stroke="#6d3811" stroke-width="3"/>
      </g>

      <!-- Girasol Derecha -->
      <g transform="translate(300, 260) scale(0.9)" filter="url(#shadow)">
        <g>
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(0)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(30)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(60)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(90)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(120)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(150)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(180)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(210)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(240)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(270)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(300)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(330)" />
        </g>
        <circle cx="0" cy="0" r="28" fill="url(#sunflowerCenter)" stroke="#6d3811" stroke-width="3"/>
      </g>

      <!-- Girasol Inferior Centro -->
      <g transform="translate(230, 310) scale(0.95)" filter="url(#shadow)">
        <g>
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(15)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(45)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(75)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(105)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(135)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(165)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(195)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(225)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(255)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(285)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(315)" />
          <path d="M0 0 L-12 -55 Q0 -70 12 -55 Z" fill="url(#petalGrad)" transform="rotate(345)" />
        </g>
        <circle cx="0" cy="0" r="28" fill="url(#sunflowerCenter)" stroke="#6d3811" stroke-width="3"/>
      </g>

      <!-- CAPA 6: Papel Envoltorio Frontal Envolvente -->
      <g filter="url(#shadow)">
        <path d="M80 260 L 230 380 L 110 490 L 50 320 Z" fill="url(#paperWrap)" />
        <path d="M380 260 L 230 380 L 350 490 L 410 320 Z" fill="url(#paperWrap)" />
        <path d="M120 340 L 230 420 L 340 340 L 230 520 Z" fill="url(#paperWrap)" />
      </g>

      <!-- CAPA 7: Luces LED Frontales Brillantes -->
      <g class="led-glow" filter="url(#glow)">
        <circle cx="160" cy="210" r="5" fill="#ffffff" />
        <circle cx="300" cy="210" r="5" fill="#ffffff" />
        <circle cx="230" cy="260" r="5" fill="#ffffff" />
        <circle cx="140" cy="330" r="5" fill="#ffffff" />
        <circle cx="320" cy="330" r="5" fill="#ffffff" />
        <circle cx="230" cy="370" r="5" fill="#ffffff" />
        <circle cx="180" cy="420" r="5" fill="#ffffff" />
        <circle cx="280" cy="420" r="5" fill="#ffffff" />
      </g>

      <!-- CAPA 8: Lazo / Moño Amarillo Elegante -->
      <g filter="url(#shadow)">
        <!-- Lazos del moño -->
        <path d="M230 440 Q 170 410 160 440 Q 170 470 230 440 Z" fill="url(#ribbonGrad)" />
        <path d="M230 440 Q 290 410 300 440 Q 290 470 230 440 Z" fill="url(#ribbonGrad)" />
        <!-- Tiras colgantes -->
        <path d="M220 440 Q 200 500 180 530 L 205 525 Q 225 480 230 440 Z" fill="url(#ribbonGrad)" />
        <path d="M240 440 Q 260 500 280 530 L 255 525 Q 235 480 230 440 Z" fill="url(#ribbonGrad)" />
        <!-- Nudo centro -->
        <circle cx="230" cy="440" r="10" fill="#ffa000" />
      </g>

      <!-- CAPA 9: Abejita Animada Posada Volando -->
      <g class="bee-animated">
        <!-- Sombra -->
        <ellipse cx="230" cy="118" rx="12" ry="4" fill="rgba(0,0,0,0.2)" />
        <!-- Alas -->
        <ellipse class="wing-left" cx="220" cy="105" rx="10" ry="5" fill="#ffffff" opacity="0.8" />
        <ellipse class="wing-right" cx="238" cy="105" rx="10" ry="5" fill="#ffffff" opacity="0.8" />
        <!-- Cuerpo -->
        <ellipse cx="229" cy="112" rx="14" ry="10" fill="#ffcc00" stroke="#333" stroke-width="1.5" />
        <!-- Franjas negras -->
        <path d="M224 103 A 10 10 0 0 0 224 121" stroke="#333" stroke-width="3" fill="none" />
        <path d="M231 102 A 10 10 0 0 0 231 122" stroke="#333" stroke-width="3" fill="none" />
        <!-- Ojo y Sonrisa -->
        <circle cx="238" cy="110" r="1.8" fill="#000" />
        <path d="M237 114 Q 239 116 241 114" stroke="#000" stroke-width="1" fill="none" />
      </g>

    </svg>
  </div>

  <script>
    // Generar destellos de luz flotantes aleatorios en el fondo
    const body = document.body;
    const sparkleCount = 30;

    for (let i = 0; i < sparkleCount; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      
      const size = Math.random() * 8 + 4;
      sparkle.style.width = `${size}px`;
      sparkle.style.height = `${size}px`;
      
      sparkle.style.left = `${Math.random() * 100}vw`;
      sparkle.style.top = `${Math.random() * 100}vh`;
      
      sparkle.style.animationDuration = `${Math.random() * 3 + 2}s`;
      sparkle.style.animationDelay = `${Math.random() * 2}s`;
      
      body.appendChild(sparkle);
    }
  </script>
</body>
</html>
